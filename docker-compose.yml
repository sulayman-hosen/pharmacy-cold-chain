services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}).ok }' | grep 1"
      interval: 5s
      timeout: 10s
      retries: 20
  hapi:
    image: hapiproject/hapi:latest
    profiles: ["fhir"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HAPI_FHIR_FHIR_VERSION: R4
volumes:
  mongo-data:
